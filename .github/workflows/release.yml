name: Release AtrisShot Desktop
on:
  workflow_dispatch:
    inputs:
      release_version: { description: "Enter only v1.0.1-1 (prerelease) or v1.0.1 (stable)", required: true, type: string }
      prerelease: { description: "Mark as prerelease", required: true, default: true, type: boolean }
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.release_version }}
  MANUAL_PRERELEASE: ${{ inputs.prerelease }}
  NEXT_PUBLIC_ATRIS_HUB_URL: https://atrishub.com
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, releaseTarget: windows-x86_64, rustTarget: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, releaseTarget: linux-x86_64, rustTarget: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libxdo-dev libxkbcommon-dev
      - run: npm ci
      - run: node .github/scripts/apply-release-version.mjs "${{ env.RELEASE_TAG }}"
        shell: bash
      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-updater-public-key.mjs
      - name: Require updater signing key
        shell: bash
        env: { TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" }
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Import Windows code-signing certificate
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "atrisshot-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows signing certificate import failed." }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Windows code signing
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: node .github/scripts/configure-windows-signing.mjs
      - name: Build signed desktop packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri -w @atris-shot/desktop -- build --target "${{ matrix.rustTarget }}"
      - uses: actions/upload-artifact@v4
        with:
          name: atris-shot-${{ matrix.releaseTarget }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          FLAGS=()
          if [[ "$MANUAL_PRERELEASE" == "true" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then FLAGS+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AtrisShot $RELEASE_TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
          test -n "$(find release-assets -type f -print -quit)"
          find release-assets -type f -print0 \
            | xargs -0 -n1 gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Smoke updater metadata for release targets
        shell: bash
        run: |
          sleep 10
          for target in windows-x86_64 linux-x86_64; do
            curl --fail "https://shot.atrishub.com/api/releases/update/${target}/0.0.0"
          done
