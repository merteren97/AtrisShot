name: Release AtrisShot Desktop
run-name: Release AtrisShot ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Enter only v1.0.1-1 (prerelease) or v1.0.1 (stable)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_version }}
  MANUAL_PRERELEASE: ${{ inputs.prerelease }}
  NEXT_PUBLIC_ATRIS_HUB_URL: https://atrishub.com

jobs:
  build:
    if: ${{ github.repository == 'merteren97/AtrisShot' && github.actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, releaseTarget: windows-x86_64, rustTarget: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, releaseTarget: linux-x86_64, rustTarget: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          shared-key: ${{ matrix.releaseTarget }}
          cache-on-failure: true

      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libxdo-dev libxkbcommon-dev

      - run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Validate requested release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi

      - run: node .github/scripts/apply-release-version.mjs "${{ env.RELEASE_TAG }}"
        shell: bash

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-updater-public-key.mjs

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Import Windows code-signing certificate
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "atrisshot-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env.WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows signing certificate import failed." }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows code signing
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: node .github/scripts/configure-windows-signing.mjs

      - name: Build signed desktop packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri:build -w @atris-shot/desktop -- --target "${{ matrix.rustTarget }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atris-shot-${{ matrix.releaseTarget }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig

  publish:
    if: ${{ github.repository == 'merteren97/AtrisShot' && github.actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$MANUAL_PRERELEASE" == "true" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then FLAGS+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AtrisShot $RELEASE_TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
          test -n "$(find release-assets -type f -print -quit)"
          mapfile -d '' RELEASE_ASSETS < <(find release-assets -type f -print0)
          gh release upload "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Smoke updater metadata for release targets
        shell: bash
        run: |
          sleep 10
          for target in windows-x86_64 linux-x86_64; do
            curl --fail "https://shot.atrishub.com/api/releases/update/${target}/0.0.0"
          done
