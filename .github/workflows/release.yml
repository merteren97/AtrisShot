name: Release AtrisShot Desktop
on:
  workflow_dispatch:
    inputs:
      release_version: { description: "Enter only v0.1.0-1 (prerelease) or v0.1.0 (stable)", required: true, type: string }
      prerelease: { description: "Mark as prerelease", required: true, default: true, type: boolean }
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.release_version }}
  MANUAL_PRERELEASE: ${{ inputs.prerelease }}
  NEXT_PUBLIC_ATRIS_HUB_URL: https://atrishub.com
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, releaseTarget: windows-x86_64, rustTarget: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, releaseTarget: linux-x86_64, rustTarget: x86_64-unknown-linux-gnu }
          - { os: macos-15-intel, releaseTarget: darwin-x86_64, rustTarget: x86_64-apple-darwin }
          - { os: macos-14, releaseTarget: darwin-aarch64, rustTarget: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libxdo-dev libxkbcommon-dev
      - run: npm ci
      - run: node .github/scripts/apply-release-version.mjs "${{ env.RELEASE_TAG }}"
        shell: bash
      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node .github/scripts/inject-updater-public-key.mjs
      - name: Require updater signing key
        shell: bash
        env: { TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" }
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
      - name: Import Windows code-signing certificate
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "atrisshot-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows signing certificate import failed." }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure Windows code signing
        if: startsWith(matrix.os, 'windows') && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: node .github/scripts/configure-windows-signing.mjs
      - name: Build signed desktop packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri:build -- --target "${{ matrix.rustTarget }}"
      - uses: actions/upload-artifact@v4
        with:
          name: atris-shot-${{ matrix.releaseTarget }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          FLAGS=()
          if [[ "$MANUAL_PRERELEASE" == "true" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then FLAGS+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AtrisShot $RELEASE_TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
          test -n "$(find release-assets -type f -print -quit)"
          find release-assets -type f -print0 \
            | xargs -0 -n1 gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Smoke updater metadata for release targets
        shell: bash
        run: |
          sleep 10
          for target in windows-x86_64 linux-x86_64 darwin-x86_64 darwin-aarch64; do
            curl --fail "https://shot.atrishub.com/api/releases/update/${target}/0.0.0"
          done
