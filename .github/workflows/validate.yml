name: Validate AtrisShot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Audit public build boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "src-tauri|microphone|transcribe_audio|ATRIS_AUTH_API_URL|DATABASE_URL" services/public-server/dist services/public-server/public; then
            echo "Public build contains a forbidden desktop or private runtime dependency."
            exit 1
          fi

  validate-rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libxdo-dev libxkbcommon-dev
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  validate-artifact-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Create deterministic validation payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-validation
          printf '%s\n' 'AtrisShot artifact roundtrip validation' > artifact-validation/payload.txt
          sha256sum artifact-validation/payload.txt > artifact-validation/payload.sha256
      - name: Upload validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atris-shot-artifact-validation
          path: artifact-validation/payload.txt
          if-no-files-found: error
          retention-days: 1
      - name: Download validation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: atris-shot-artifact-validation
          path: artifact-validation-downloaded
      - name: Verify artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact-validation-downloaded/payload.txt
          cmp artifact-validation/payload.txt artifact-validation-downloaded/payload.txt
          sha256sum --check artifact-validation/payload.sha256
